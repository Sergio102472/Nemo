<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Nemo — Модуль 1 (прототип)</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
			min-height: 100vh;
			color: #e8e8e8;
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding: 24px 16px;
		}
		.app {
			width: 100%;
			max-width: 420px;
		}
		h1 {
			text-align: center;
			font-size: 1.75rem;
			background: linear-gradient(90deg, #7c5cff, #00d4ff);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			margin-bottom: 4px;
		}
		.subtitle {
			text-align: center;
			color: #8b8b9e;
			font-size: 0.9rem;
			margin-bottom: 20px;
		}
		.log {
			background: #1a1a2e;
			border: 1px solid #3a3a5c;
			border-radius: 12px;
			padding: 10px 14px;
			max-height: 140px;
			overflow-y: auto;
			font-family: ui-monospace, monospace;
			font-size: 0.72rem;
			color: #9a9ab0;
			margin-bottom: 20px;
			line-height: 1.5;
		}
		.log div { margin-bottom: 2px; }
		.card {
			background: rgba(30, 30, 50, 0.9);
			border: 1px solid #2a2a45;
			border-radius: 20px;
			padding: 24px 20px;
		}
		.row {
			display: flex;
			gap: 14px;
			margin-bottom: 16px;
		}
		.field { flex: 1; display: flex; flex-direction: column; gap: 6px; }
		label {
			font-size: 0.75rem;
			color: #8b8b9e;
			text-transform: uppercase;
			letter-spacing: 0.04em;
		}
		select, input[type="number"] {
			background: #1a1a2e;
			border: 1px solid #3a3a5c;
			color: #e8e8e8;
			padding: 12px 14px;
			border-radius: 12px;
			font-size: 1rem;
			outline: none;
			width: 100%;
		}
		select { cursor: pointer; }
		select:focus, input:focus { border-color: #7c5cff; }
		input[type="number"] {
			font-size: 1.2rem;
			font-weight: 600;
		}
		input[type="number"]::placeholder {
			color: #5a5a70;
			font-weight: 400;
		}
		input[readonly] {
			opacity: 0.85;
			cursor: default;
		}
		.rate {
			text-align: center;
			padding: 12px;
			background: rgba(124, 92, 255, 0.1);
			border-radius: 12px;
			margin-bottom: 20px;
			font-size: 0.95rem;
			color: #b0b0c8;
		}
		.rate strong { color: #00d4ff; }
		button {
			width: 100%;
			background: linear-gradient(90deg, #7c5cff, #5b8def);
			border: none;
			color: white;
			padding: 15px;
			border-radius: 14px;
			font-size: 1.1rem;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { opacity: 0.92; }
		button:disabled { opacity: 0.4; cursor: not-allowed; }
		.footer {
			margin-top: 18px;
			text-align: center;
			font-size: 0.75rem;
			color: #5a5a70;
		}
	</style>
</head>
<body>
	<div class="app">
		<h1>Nemo</h1>
		<p class="subtitle">Модуль 1 · $mol-прототип (браузерная версия)</p>

		<!-- Информационное окошко лога -->
		<div class="log" id="log"></div>

		<div class="card">
			<!-- Селекты валют -->
			<div class="row">
				<div class="field">
					<label>Отдаёте</label>
					<select id="from"></select>
				</div>
				<div class="field">
					<label>Получаете</label>
					<select id="to"></select>
				</div>
			</div>

			<!-- Поля суммы -->
			<div class="row">
				<div class="field">
					<label>Сумма</label>
					<input type="number" id="fromAmount" placeholder="0.0" min="0" step="any" />
				</div>
				<div class="field">
					<label>Сумма</label>
					<input type="number" id="toAmount" placeholder="0.0" readonly />
				</div>
			</div>

			<div class="rate" id="rate">—</div>

			<button id="swap" disabled>Обменять</button>
		</div>

		<p class="footer">Лог сверху показывает последовательность действий · токен = квант времени</p>
	</div>

	<script>
		const COINS = ['BTC', 'ETH', 'USDT', 'USDC', 'SOL', 'BNB']
		const RATES = { BTC: 95000, ETH: 3200, USDT: 1, USDC: 1, SOL: 180, BNB: 580 }

		const logEl = document.getElementById('log')
		const fromEl = document.getElementById('from')
		const toEl = document.getElementById('to')
		const fromAmountEl = document.getElementById('fromAmount')
		const toAmountEl = document.getElementById('toAmount')
		const rateEl = document.getElementById('rate')
		const swapBtn = document.getElementById('swap')

		function log(msg) {
			const time = new Date().toLocaleTimeString('ru-RU')
			const line = document.createElement('div')
			line.textContent = `[${time}] ${msg}`
			logEl.prepend(line)
			while (logEl.children.length > 25) logEl.lastChild.remove()
		}

		function fillSelects() {
			COINS.forEach(c => {
				fromEl.add(new Option(c, c))
				toEl.add(new Option(c, c))
			})
			fromEl.value = 'ETH'
			toEl.value = 'USDT'
		}

		function getRate() {
			const from = fromEl.value
			const to = toEl.value
			return (RATES[from] || 1) / (RATES[to] || 1)
		}

		function updateRate() {
			const from = fromEl.value
			const to = toEl.value
			const r = getRate()
			rateEl.innerHTML = `1 ${from} ≈ <strong>${r.toFixed(6)}</strong> ${to}`
			log(`Курс обновлён: 1 ${from} = ${r.toFixed(6)} ${to}`)
			calcToAmount()
			updateButton()
		}

		function calcToAmount() {
			const amount = parseFloat(fromAmountEl.value)
			if (!amount || isNaN(amount) || amount <= 0) {
				toAmountEl.value = ''
				return
			}
			const result = amount * getRate()
			toAmountEl.value = result.toFixed(8).replace(/\.?0+$/, '')
		}

		function updateButton() {
			const amount = parseFloat(fromAmountEl.value)
			const same = fromEl.value === toEl.value
			swapBtn.disabled = same || !amount || amount <= 0
		}

		fromEl.addEventListener('change', () => {
			log(`Выбрана валюта «из»: ${fromEl.value}`)
			updateRate()
		})
		toEl.addEventListener('change', () => {
			log(`Выбрана валюта «в»: ${toEl.value}`)
			updateRate()
		})

		fromAmountEl.addEventListener('input', () => {
			calcToAmount()
			updateButton()
			const v = fromAmountEl.value
			if (v) log(`Введена сумма: ${v} ${fromEl.value}`)
		})

		swapBtn.addEventListener('click', () => {
			const quantum = Date.now()
			const fromAmt = fromAmountEl.value
			const toAmt = toAmountEl.value
			log(`Нажата кнопка «Обменять»`)
			log(`Создан токен (квант времени): ${quantum}`)
			log(`Ордер: ${fromAmt} ${fromEl.value} → ${toAmt} ${toEl.value}`)
			log(`Внутренний обмен выполнен (демо)`)
		})

		// init
		fillSelects()
		log('Модуль 1 загружен')
		log('Ожидание действий пользователя...')
		updateRate()
	</script>
</body>
</html>
