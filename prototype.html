<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Nemo — Модуль 1</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
			min-height: 100vh;
			color: #e8e8e8;
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding: 24px 16px;
		}
		.app { width: 100%; max-width: 440px; }
		h1 {
			text-align: center;
			font-size: 1.75rem;
			background: linear-gradient(90deg, #7c5cff, #00d4ff);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			margin-bottom: 4px;
		}
		.subtitle {
			text-align: center;
			color: #8b8b9e;
			font-size: 0.9rem;
			margin-bottom: 20px;
		}
		.log {
			background: #1a1a2e;
			border: 1px solid #3a3a5c;
			border-radius: 12px;
			padding: 10px 14px;
			max-height: 130px;
			overflow-y: auto;
			font-family: ui-monospace, monospace;
			font-size: 0.72rem;
			color: #9a9ab0;
			margin-bottom: 16px;
			line-height: 1.5;
		}
		.log div { margin-bottom: 2px; }
		.card {
			background: rgba(30, 30, 50, 0.9);
			border: 1px solid #2a2a45;
			border-radius: 20px;
			padding: 24px 20px;
		}
		.row {
			display: flex;
			gap: 14px;
			margin-bottom: 14px;
		}
		.field { flex: 1; display: flex; flex-direction: column; gap: 6px; }
		label {
			font-size: 0.75rem;
			color: #8b8b9e;
			text-transform: uppercase;
			letter-spacing: 0.04em;
		}
		select, input[type="number"] {
			background: #1a1a2e;
			border: 1px solid #3a3a5c;
			color: #e8e8e8;
			padding: 12px 14px;
			border-radius: 12px;
			font-size: 1rem;
			outline: none;
			width: 100%;
		}
		select { cursor: pointer; }
		select:focus, input:focus { border-color: #7c5cff; }
		input[type="number"] { font-size: 1.2rem; font-weight: 600; }
		input[type="number"]::placeholder { color: #5a5a70; font-weight: 400; }
		input[readonly] { opacity: 0.85; cursor: default; }
		.reserve {
			font-size: 0.78rem;
			color: #a78bfa;
			background: rgba(167, 139, 250, 0.08);
			border: 1px dashed rgba(167, 139, 250, 0.35);
			border-radius: 10px;
			padding: 10px 12px;
			margin-bottom: 14px;
			line-height: 1.45;
			min-height: 2.4em;
		}
		.reserve.empty { color: #5a5a70; border-style: solid; border-color: #2a2a45; background: transparent; }
		.rate {
			text-align: center;
			padding: 12px;
			background: rgba(124, 92, 255, 0.1);
			border-radius: 12px;
			margin-bottom: 16px;
			font-size: 0.95rem;
			color: #b0b0c8;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 4px;
		}
		.rate strong { color: #00d4ff; }
		.rate-tick { font-size: 0.85rem; font-weight: 600; }
		.rate-tick.up { color: #22c55e; }
		.rate-tick.down { color: #ef4444; }
		.rate-tick.flat { color: #8b8b9e; }
		.rate-meta { font-size: 0.7rem; color: #6b6b80; }
		button {
			width: 100%;
			background: linear-gradient(90deg, #7c5cff, #5b8def);
			border: none;
			color: white;
			padding: 15px;
			border-radius: 14px;
			font-size: 1.1rem;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { opacity: 0.92; }
		button:disabled { opacity: 0.4; cursor: not-allowed; }
		.token-box {
			margin-top: 18px;
			background: rgba(0, 212, 255, 0.07);
			border: 1px solid rgba(0, 212, 255, 0.28);
			border-radius: 14px;
			padding: 14px 16px;
		}
		.token-box h3 {
			font-size: 0.75rem;
			color: #00d4ff;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			margin-bottom: 8px;
		}
		.token-id {
			font-family: ui-monospace, monospace;
			font-size: 0.95rem;
			color: #e8e8e8;
			word-break: break-all;
			line-height: 1.5;
		}
		.token-deal {
			margin-top: 8px;
			font-size: 0.9rem;
			color: #b0b0c8;
		}
		.orders {
			margin-top: 20px;
		}
		.orders h3 {
			font-size: 0.8rem;
			color: #8b8b9e;
			margin-bottom: 10px;
			text-align: center;
		}
		.order {
			background: rgba(30, 30, 50, 0.7);
			border: 1px solid #2a2a45;
			border-radius: 12px;
			padding: 10px 14px;
			margin-bottom: 8px;
			font-family: ui-monospace, monospace;
			font-size: 0.78rem;
			color: #c8c8d8;
			line-height: 1.45;
		}
		.footer {
			margin-top: 18px;
			text-align: center;
			font-size: 0.72rem;
			color: #5a5a70;
			line-height: 1.4;
		}
	</style>
</head>
<body>
	<div class="app">
		<h1>Nemo</h1>
		<p class="subtitle">резерв → квант времени → мгновенный обмен</p>

		<div class="log" id="log"></div>

		<div class="card">
			<div class="row">
				<div class="field">
					<label>Отдаёте</label>
					<select id="from"></select>
				</div>
				<div class="field">
					<label>Получаете</label>
					<select id="to"></select>
				</div>
			</div>

			<div class="row">
				<div class="field">
					<label>Сумма</label>
					<input type="number" id="fromAmount" placeholder="0.0" min="0" step="any" />
				</div>
				<div class="field">
					<label>Сумма</label>
					<input type="number" id="toAmount" placeholder="0.0" readonly />
				</div>
			</div>

			<!-- Резерв сделки (до нажатия кнопки) -->
			<div class="reserve empty" id="reserve">Резерв пуст — выберите валюты и сумму</div>

			<div class="rate">
				<div id="rateMain">—</div>
				<div class="rate-tick flat" id="rateTick">—</div>
				<div class="rate-meta" id="rateMeta">загрузка...</div>
			</div>

			<button id="swap" disabled>Обменять</button>
		</div>

		<!-- Последний токен -->
		<div class="token-box" id="tokenBox" style="display:none">
			<h3>Токен ордера (квант времени)</h3>
			<div class="token-id" id="tokenId"></div>
			<div class="token-deal" id="tokenDeal"></div>
		</div>

		<!-- Архив -->
		<div class="orders" id="ordersWrap" style="display:none">
			<h3>Архив ордеров</h3>
			<div id="ordersList"></div>
		</div>

		<p class="footer">
			До кнопки — только резерв (обрыва сети не страшен).<br>
			Нажатие = фиксация времени + мгновенный внутренний обмен.
		</p>
	</div>

	<script>
		const COINS = ['BTC', 'ETH', 'USDT', 'USDC', 'SOL', 'BNB']
		const CG_IDS = {
			BTC: 'bitcoin', ETH: 'ethereum', USDT: 'tether',
			USDC: 'usd-coin', SOL: 'solana', BNB: 'binancecoin',
		}

		let ratesUsd = { BTC: 95000, ETH: 3200, USDT: 1, USDC: 1, SOL: 180, BNB: 580 }
		let prevPairRate = null
		let lastUpdate = null
		let liveMode = false
		let reserve = null   // { from, to, fromAmt, toAmt, rate } — до нажатия
		let orders = []

		const $ = id => document.getElementById(id)
		const logEl = $('log')
		const fromEl = $('from')
		const toEl = $('to')
		const fromAmountEl = $('fromAmount')
		const toAmountEl = $('toAmount')
		const reserveEl = $('reserve')
		const rateMain = $('rateMain')
		const rateTick = $('rateTick')
		const rateMeta = $('rateMeta')
		const swapBtn = $('swap')

		function log(msg) {
			const time = new Date().toLocaleTimeString('ru-RU')
			const line = document.createElement('div')
			line.textContent = `[${time}] ${msg}`
			logEl.prepend(line)
			while (logEl.children.length > 30) logEl.lastChild.remove()
		}

		/** Человекочитаемый квант времени: ГГГГ-ММ-ДД ЧЧ:ММ:СС.ммм */
		function formatQuantum(ms) {
			const d = new Date(ms)
			const pad = (n, len = 2) => String(n).padStart(len, '0')
			const y = d.getFullYear()
			const mo = pad(d.getMonth() + 1)
			const day = pad(d.getDate())
			const h = pad(d.getHours())
			const mi = pad(d.getMinutes())
			const s = pad(d.getSeconds())
			const ms3 = pad(d.getMilliseconds(), 3)
			return `${y}-${mo}-${day} ${h}:${mi}:${s}.${ms3}`
		}

		/** Лаконичный токен: время | сумма FROM → сумма TO */
		function buildToken(quantumMs, fromAmt, fromCoin, toAmt, toCoin) {
			const time = formatQuantum(quantumMs)
			return `${time} | ${fromAmt} ${fromCoin} → ${toAmt} ${toCoin}`
		}

		function fillSelects() {
			COINS.forEach(c => {
				fromEl.add(new Option(c, c))
				toEl.add(new Option(c, c))
			})
			fromEl.value = 'ETH'
			toEl.value = 'USDT'
		}

		function getPairRate() {
			return (ratesUsd[fromEl.value] || 1) / (ratesUsd[toEl.value] || 1)
		}

		function calcToAmount() {
			const amount = parseFloat(fromAmountEl.value)
			if (!amount || isNaN(amount) || amount <= 0) {
				toAmountEl.value = ''
				return null
			}
			const result = amount * getPairRate()
			const formatted = result.toFixed(8).replace(/\.?0+$/, '')
			toAmountEl.value = formatted
			return formatted
		}

		/** Резерв: данные сделки без действий на кошельках */
		function updateReserve() {
			const fromAmt = parseFloat(fromAmountEl.value)
			const toAmtStr = calcToAmount()
			const same = fromEl.value === toEl.value

			if (!fromAmt || fromAmt <= 0 || same || !toAmtStr) {
				reserve = null
				reserveEl.className = 'reserve empty'
				reserveEl.textContent = 'Резерв пуст — выберите валюты и сумму'
				swapBtn.disabled = true
				return
			}

			const rate = getPairRate()
			reserve = {
				from: fromEl.value,
				to: toEl.value,
				fromAmt: fromAmt,
				toAmt: parseFloat(toAmtStr),
				toAmtStr,
				rate,
			}

			reserveEl.className = 'reserve'
			reserveEl.innerHTML =
				`<strong>Резерв:</strong> ${fromAmt} ${reserve.from} → ${toAmtStr} ${reserve.to}` +
				`<br><span style="opacity:.75">на кошельках ещё ничего не сделано</span>`
			swapBtn.disabled = false
		}

		function renderRate(tickDir) {
			const r = getPairRate()
			rateMain.innerHTML = `1 ${fromEl.value} ≈ <strong>${r.toFixed(6)}</strong> ${toEl.value}`
			rateTick.className = 'rate-tick ' + (tickDir || 'flat')
			rateTick.textContent = tickDir === 'up' ? '▲ вверх' : tickDir === 'down' ? '▼ вниз' : '● без изменений'
			const src = liveMode ? 'CoinGecko' : 'демо'
			const t = lastUpdate ? lastUpdate.toLocaleTimeString('ru-RU') : '—'
			rateMeta.textContent = `${src} · ${t}`
			updateReserve()
		}

		function applyRates(newRates, sourceLive) {
			const before = getPairRate()
			ratesUsd = { ...ratesUsd, ...newRates }
			const after = getPairRate()
			lastUpdate = new Date()
			liveMode = sourceLive
			let dir = 'flat'
			if (prevPairRate !== null) {
				if (after > prevPairRate + 1e-12) dir = 'up'
				else if (after < prevPairRate - 1e-12) dir = 'down'
			}
			prevPairRate = after
			renderRate(dir)
			if (dir === 'up') log(`Тик ▲ 1 ${fromEl.value} = ${after.toFixed(6)} ${toEl.value}`)
			else if (dir === 'down') log(`Тик ▼ 1 ${fromEl.value} = ${after.toFixed(6)} ${toEl.value}`)
		}

		function simulateTick() {
			const next = { ...ratesUsd }
			Object.keys(next).forEach(k => {
				if (k === 'USDT' || k === 'USDC') return
				next[k] = +(ratesUsd[k] * (1 + (Math.random() - 0.5) * 0.004)).toFixed(4)
			})
			applyRates(next, false)
		}

		async function fetchLiveRates() {
			try {
				const ids = Object.values(CG_IDS).join(',')
				const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`)
				if (!res.ok) throw new Error('HTTP ' + res.status)
				const data = await res.json()
				const mapped = {}
				for (const [sym, id] of Object.entries(CG_IDS)) {
					if (data[id]?.usd != null) mapped[sym] = data[id].usd
				}
				if (Object.keys(mapped).length) {
					applyRates(mapped, true)
					return true
				}
			} catch (e) {
				log(`API недоступен, симуляция тиков`)
			}
			return false
		}

		async function refreshRates() {
			const ok = await fetchLiveRates()
			if (!ok) simulateTick()
		}

		function renderOrders() {
			if (!orders.length) return
			$('ordersWrap').style.display = 'block'
			$('ordersList').innerHTML = orders.map(o =>
				`<div class="order">${o.token}</div>`
			).join('')
		}

		/** Нажатие «Обменять» = открытие ордера */
		function executeSwap() {
			if (!reserve) return

			// 1. Фиксируем квант времени — момент нажатия
			const quantum = Date.now()

			// 2. Берём актуальный курс на этот момент (из резерва / пересчёт)
			const rate = getPairRate()
			const fromAmt = reserve.fromAmt
			const toAmtStr = (fromAmt * rate).toFixed(8).replace(/\.?0+$/, '')
			const from = reserve.from
			const to = reserve.to

			// 3. Лаконичный человекочитаемый токен
			const token = buildToken(quantum, fromAmt, from, toAmtStr, to)

			const order = {
				quantum,
				token,
				from, to,
				fromAmt,
				toAmt: parseFloat(toAmtStr),
				rate,
			}

			orders.unshift(order)

			// UI токена
			$('tokenBox').style.display = 'block'
			$('tokenId').textContent = formatQuantum(quantum)
			$('tokenDeal').textContent = `${fromAmt} ${from} → ${toAmtStr} ${to}`

			renderOrders()

			log(`Резерв → ордер открыт`)
			log(`Токен: ${token}`)
			log(`Мгновенный внутренний обмен выполнен`)

			// Очищаем форму и резерв (сделка уже в архиве)
			fromAmountEl.value = ''
			toAmountEl.value = ''
			reserve = null
			updateReserve()
		}

		fromEl.addEventListener('change', () => {
			log(`Валюта «из»: ${fromEl.value}`)
			prevPairRate = null
			renderRate('flat')
		})
		toEl.addEventListener('change', () => {
			log(`Валюта «в»: ${toEl.value}`)
			prevPairRate = null
			renderRate('flat')
		})
		fromAmountEl.addEventListener('input', () => {
			updateReserve()
			if (reserve) log(`Резерв: ${reserve.fromAmt} ${reserve.from} → ${reserve.toAmtStr} ${reserve.to}`)
		})
		swapBtn.addEventListener('click', executeSwap)

		fillSelects()
		log('Модуль 1 загружен')
		log('До кнопки — только резерв, без действий на кошельках')
		renderRate('flat')
		refreshRates()
		setInterval(refreshRates, 8000)
	</script>
</body>
</html>
