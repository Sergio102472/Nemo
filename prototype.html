<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Nemo — обмен</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: #0f0f1a;
			color: #e8e8e8;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding: 28px 16px 40px;
		}
		.box {
			width: 100%;
			max-width: 420px;
			background: #1a1a2e;
			border: 1px solid #2a2a45;
			border-radius: 16px;
			padding: 22px 18px;
		}
		h1 {
			text-align: center;
			font-size: 1.5rem;
			margin-bottom: 6px;
			background: linear-gradient(90deg, #7c5cff, #00d4ff);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}
		.sub {
			text-align: center;
			font-size: 0.75rem;
			color: #6b6b80;
			margin-bottom: 12px;
		}

		/* Лог действий */
		.log {
			background: #0d0d18;
			border: 1px solid #2a2a45;
			border-radius: 12px;
			padding: 10px 12px;
			max-height: 140px;
			overflow-y: auto;
			font-family: ui-monospace, monospace;
			font-size: 0.68rem;
			color: #9a9ab0;
			margin-bottom: 14px;
			line-height: 1.45;
		}
		.log .line { margin-bottom: 2px; }
		.log .line .ts { color: #5a5a70; }
		.log .line.step { color: #c4b5fd; }
		.log .line.ok { color: #22c55e; }
		.log .line.warn { color: #fbbf24; }

		.block {
			background: #12121f;
			border: 1px solid #2a2a45;
			border-radius: 14px;
			padding: 14px;
			margin-bottom: 12px;
		}
		.block-label {
			font-size: 0.7rem;
			color: #8b8b9e;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			margin-bottom: 10px;
		}
		.row {
			display: flex;
			gap: 10px;
			align-items: center;
			margin-bottom: 10px;
		}
		.row:last-child { margin-bottom: 0; }
		.wrap { position: relative; }

		/* Кнопка валюты: название + баланс + цифры */
		button.currency {
			min-width: 112px;
			padding: 10px 12px;
			border-radius: 12px;
			border: 1px solid #3a3a5c;
			background: #252540;
			color: #fff;
			cursor: pointer;
			text-align: left;
			line-height: 1.25;
		}
		button.currency:hover { border-color: #7c5cff; }
		button.currency .sym {
			display: block;
			font-weight: 800;
			font-size: 1rem;
		}
		button.currency .bal-label {
			display: block;
			font-size: 0.62rem;
			color: #8b8b9e;
			font-weight: 500;
			text-transform: uppercase;
			letter-spacing: 0.03em;
			margin-top: 2px;
		}
		button.currency .bal-val {
			display: block;
			font-size: 0.78rem;
			font-family: ui-monospace, monospace;
			font-weight: 600;
			color: #c8c8d8;
			margin-top: 1px;
		}

		/* Курс — справа от кнопки */
		.rate-side {
			flex: 1;
			text-align: right;
		}
		.rate-price {
			font-family: ui-monospace, monospace;
			font-size: 0.95rem;
			color: #00d4ff;
			font-weight: 600;
		}
		.rate-tick {
			font-size: 0.8rem;
			font-weight: 700;
			margin-top: 2px;
		}
		.rate-tick.up { color: #22c55e; }
		.rate-tick.down { color: #ef4444; }
		.rate-tick.flat { color: #6b6b80; }

		input[type="number"] {
			width: 100%;
			padding: 12px 14px;
			border-radius: 12px;
			border: 1px solid #3a3a5c;
			background: #1a1a2e;
			color: #fff;
			font-size: 1.1rem;
			font-weight: 600;
			outline: none;
		}
		input:focus { border-color: #7c5cff; }

		.reserve {
			font-size: 0.72rem;
			color: #8b8b9e;
			text-align: center;
			margin: 10px 0 6px;
			min-height: 1.3em;
		}
		.reserve.on { color: #fbbf24; }
		.fee {
			text-align: center;
			color: #a78bfa;
			font-size: 0.9rem;
			margin-bottom: 12px;
		}
		button.swap {
			width: 100%;
			padding: 14px;
			border: none;
			border-radius: 14px;
			background: linear-gradient(90deg, #7c5cff, #5b8def);
			color: #fff;
			font-size: 1.1rem;
			font-weight: 700;
			cursor: pointer;
		}
		button.swap:disabled { opacity: 0.4; cursor: not-allowed; }

		.token-card {
			margin-top: 14px;
			padding: 12px 14px;
			background: rgba(0, 212, 255, 0.08);
			border: 1px solid rgba(0, 212, 255, 0.3);
			border-radius: 12px;
			display: none;
		}
		.token-card.show { display: block; }
		.token-title {
			font-size: 0.7rem;
			color: #00d4ff;
			text-transform: uppercase;
			margin-bottom: 6px;
			text-align: center;
		}
		.token-body {
			font-family: ui-monospace, monospace;
			font-size: 0.78rem;
			line-height: 1.5;
			word-break: break-word;
		}
		.token-body .t { color: #fbbf24; }

		.app-wallet {
			margin-top: 14px;
			padding: 12px;
			background: rgba(167, 139, 250, 0.1);
			border: 1px solid rgba(167, 139, 250, 0.3);
			border-radius: 12px;
			font-size: 0.8rem;
		}
		.app-wallet h3 {
			font-size: 0.75rem;
			color: #c4b5fd;
			margin-bottom: 8px;
			text-align: center;
		}
		.app-wallet .row-bal {
			display: flex;
			justify-content: space-between;
			font-family: ui-monospace, monospace;
			padding: 2px 0;
			color: #c8c8d8;
		}

		.orders { margin-top: 14px; }
		.orders h3 {
			font-size: 0.75rem;
			color: #8b8b9e;
			text-align: center;
			margin-bottom: 8px;
		}
		.orders li {
			list-style: none;
			font-family: ui-monospace, monospace;
			font-size: 0.7rem;
			background: #12121f;
			border: 1px solid #2a2a45;
			border-radius: 10px;
			padding: 10px;
			margin-bottom: 6px;
			line-height: 1.4;
			color: #c8c8d8;
		}

		.menu {
			position: absolute;
			top: 100%;
			left: 0;
			margin-top: 4px;
			background: #252540;
			border: 1px solid #3a3a5c;
			border-radius: 12px;
			padding: 6px;
			z-index: 20;
			display: none;
			min-width: 130px;
			box-shadow: 0 8px 24px rgba(0,0,0,0.4);
		}
		.menu.open { display: block; }
		.menu button {
			display: block;
			width: 100%;
			text-align: left;
			background: transparent;
			border: none;
			color: #e8e8e8;
			padding: 10px 12px;
			border-radius: 8px;
			cursor: pointer;
			font-weight: 600;
		}
		.menu button:hover { background: rgba(124,92,255,0.25); }
	</style>
</head>
<body>
	<div class="box">
		<h1>Nemo</h1>
		<p class="sub">Резерв → ордер · токен = квант времени</p>

		<div class="log" id="log"></div>

		<div class="block">
			<div class="block-label">Отдаёте</div>
			<div class="row">
				<div class="wrap">
					<button type="button" class="currency" id="fromBtn">
						<span class="sym">BTC</span>
						<span class="bal-label">баланс</span>
						<span class="bal-val" id="fromBalVal">0</span>
					</button>
					<div class="menu" id="fromMenu"></div>
				</div>
				<div class="rate-side">
					<div class="rate-price" id="fromPrice">—</div>
					<div class="rate-tick flat" id="fromTick">●</div>
				</div>
			</div>
			<div class="row">
				<input type="number" id="fromAmount" placeholder="0.0" min="0" step="any" />
			</div>
		</div>

		<div class="block">
			<div class="block-label">Получаете</div>
			<div class="row">
				<div class="wrap">
					<button type="button" class="currency" id="toBtn">
						<span class="sym">USDT</span>
						<span class="bal-label">баланс</span>
						<span class="bal-val" id="toBalVal">0</span>
					</button>
					<div class="menu" id="toMenu"></div>
				</div>
				<div class="rate-side">
					<div class="rate-price" id="toPrice">—</div>
					<div class="rate-tick flat" id="toTick">●</div>
				</div>
			</div>
			<div class="row">
				<input type="number" id="toAmount" placeholder="0.0" min="0" step="any" />
			</div>
		</div>

		<div class="reserve" id="reserve">Нет резерва — введите сумму</div>
		<div class="fee">Комиссия 1% → кошелёк приложения</div>
		<button type="button" class="swap" id="swapBtn" disabled>Обменять</button>

		<div class="token-card" id="tokenCard">
			<div class="token-title">Токен ордера (квант времени)</div>
			<div class="token-body" id="tokenBody"></div>
		</div>

		<div class="app-wallet">
			<h3>Кошелёк приложения (монетизация 1%)</h3>
			<div id="appBal"></div>
		</div>

		<div class="orders" id="ordersBlock" style="display:none">
			<h3>Архив ордеров</h3>
			<ul id="ordersList"></ul>
		</div>
	</div>

	<script>
		const COINS = ['BTC', 'ETH', 'USDT', 'USDC', 'SOL', 'BNB']
		const CG = {
			BTC: 'bitcoin', ETH: 'ethereum', USDT: 'tether',
			USDC: 'usd-coin', SOL: 'solana', BNB: 'binancecoin',
		}
		const FEE = 0.01

		let wallet = { BTC: 0.5, ETH: 4.2, USDT: 2500, USDC: 1000, SOL: 35, BNB: 8 }
		let appWallet = {}
		let usd = { BTC: 95000, ETH: 3200, USDT: 1, USDC: 1, SOL: 180, BNB: 580 }
		let prevUsd = { ...usd }

		let fromCoin = 'BTC'
		let toCoin = 'USDT'
		let editSide = 'from'
		let reserve = null
		let orders = []

		const $ = id => document.getElementById(id)

		function fmt(n, d = 8) {
			if (n == null || !isFinite(n)) return '0'
			return (+Number(n).toFixed(d)).toString()
		}

		function log(msg, cls = '') {
			const el = document.createElement('div')
			el.className = 'line' + (cls ? ' ' + cls : '')
			const ts = new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit', fractionalSecondDigits: 3 })
			el.innerHTML = `<span class="ts">[${ts}]</span> ${msg}`
			$('log').prepend(el)
			while ($('log').children.length > 60) $('log').lastChild.remove()
		}

		function pairRate() {
			return (usd[fromCoin] || 1) / (usd[toCoin] || 1)
		}

		function tickDir(coin) {
			const a = usd[coin], b = prevUsd[coin]
			if (b == null) return 'flat'
			if (a > b + 1e-12) return 'up'
			if (a < b - 1e-12) return 'down'
			return 'flat'
		}

		function tickSym(d) {
			return d === 'up' ? '▲' : d === 'down' ? '▼' : '●'
		}

		function buildToken(ms, from, fromAmt, rate, to, toAmt) {
			const d = new Date(ms)
			const p = (n, l = 2) => String(n).padStart(l, '0')
			return `${p(d.getMilliseconds(), 3)}.${p(d.getSeconds())}.${p(d.getMinutes())}.${p(d.getHours())}.${p(d.getDate())}.${d.getFullYear()} | ${fmt(fromAmt)} ${from} @ ${fmt(rate, 6)} → ${fmt(toAmt)} ${to}`
		}

		function setCurrencyBtn(btnId, coin, balId) {
			const btn = $(btnId)
			btn.querySelector('.sym').textContent = coin
			$(balId).textContent = fmt(wallet[coin] || 0)
		}

		function renderBalances() {
			setCurrencyBtn('fromBtn', fromCoin, 'fromBalVal')
			setCurrencyBtn('toBtn', toCoin, 'toBalVal')
		}

		function renderRates() {
			const df = tickDir(fromCoin)
			const dt = tickDir(toCoin)
			$('fromPrice').textContent = `$${fmt(usd[fromCoin], 2)}`
			$('toPrice').textContent = `$${fmt(usd[toCoin], 2)}`
			$('fromTick').className = 'rate-tick ' + df
			$('fromTick').textContent = tickSym(df) + ' курс'
			$('toTick').className = 'rate-tick ' + dt
			$('toTick').textContent = tickSym(dt) + ' курс'
		}

		function renderAppWallet() {
			const entries = Object.entries(appWallet).filter(([, v]) => v > 1e-12)
			if (!entries.length) {
				$('appBal').innerHTML = '<div class="row-bal"><span>пока пусто</span><b>0</b></div>'
				return
			}
			$('appBal').innerHTML = entries.map(([c, v]) =>
				`<div class="row-bal"><span>${c}</span><b>${fmt(v)}</b></div>`
			).join('')
		}

		function updateReserve() {
			const fromAmt = parseFloat($('fromAmount').value)
			const toAmt = parseFloat($('toAmount').value)
			const r = pairRate()
			const same = fromCoin === toCoin
			const bal = wallet[fromCoin] || 0

			if (!fromAmt || fromAmt <= 0 || same || !toAmt) {
				reserve = null
				$('reserve').textContent = 'Нет резерва — введите сумму'
				$('reserve').className = 'reserve'
				$('swapBtn').disabled = true
				return
			}
			if (fromAmt > bal) {
				reserve = null
				$('reserve').textContent = `Недостаточно ${fromCoin}: ${fmt(bal)}`
				$('reserve').className = 'reserve'
				$('swapBtn').disabled = true
				return
			}

			reserve = { from: fromCoin, to: toCoin, fromAmt, toAmt, rate: r }
			$('reserve').textContent =
				`Резерв: ${fmt(fromAmt)} ${fromCoin} → ${fmt(toAmt)} ${toCoin} @ ${fmt(r, 6)}`
			$('reserve').className = 'reserve on'
			$('swapBtn').disabled = false
		}

		function recalc() {
			const r = pairRate()
			if (editSide === 'from') {
				const v = parseFloat($('fromAmount').value)
				if (!v || v <= 0) { $('toAmount').value = ''; updateReserve(); return }
				$('toAmount').value = fmt(v * (1 - FEE) * r)
			} else {
				const v = parseFloat($('toAmount').value)
				if (!v || v <= 0) { $('fromAmount').value = ''; updateReserve(); return }
				$('fromAmount').value = fmt(v / (r * (1 - FEE)))
			}
			updateReserve()
		}

		function fillMenu(menu, current, onPick) {
			menu.innerHTML = COINS.map(c =>
				`<button type="button" data-c="${c}">${c}${c === current ? ' ✓' : ''}</button>`
			).join('')
			menu.querySelectorAll('button').forEach(b => {
				b.onclick = (e) => {
					e.stopPropagation()
					onPick(b.dataset.c)
					menu.classList.remove('open')
				}
			})
		}

		$('fromBtn').onclick = (e) => {
			e.stopPropagation()
			$('toMenu').classList.remove('open')
			fillMenu($('fromMenu'), fromCoin, (c) => {
				fromCoin = c
				renderBalances(); renderRates(); recalc()
				log(`Выбрана валюта отдачи: ${c}`)
			})
			$('fromMenu').classList.toggle('open')
		}
		$('toBtn').onclick = (e) => {
			e.stopPropagation()
			$('fromMenu').classList.remove('open')
			fillMenu($('toMenu'), toCoin, (c) => {
				toCoin = c
				renderBalances(); renderRates(); recalc()
				log(`Выбрана валюта получения: ${c}`)
			})
			$('toMenu').classList.toggle('open')
		}
		document.addEventListener('click', () => {
			$('fromMenu').classList.remove('open')
			$('toMenu').classList.remove('open')
		})

		$('fromAmount').addEventListener('input', () => {
			editSide = 'from'
			recalc()
			if (reserve) log(`Резерв обновлён: ${fmt(reserve.fromAmt)} ${reserve.from}`, 'warn')
		})
		$('toAmount').addEventListener('input', () => {
			editSide = 'to'
			recalc()
			if (reserve) log(`Резерв обновлён: ${fmt(reserve.toAmt)} ${reserve.to}`, 'warn')
		})

		$('swapBtn').onclick = () => {
			if (!reserve) return

			log('——— Старт обмена ———', 'step')

			// 1
			const quantum = Date.now()
			log(`1. Фиксирую время нажатия кнопки: ${quantum}`, 'step')

			// 2
			const from = reserve.from
			const to = reserve.to
			const fromAmt = reserve.fromAmt
			const rate = pairRate()
			const feeAmt = fromAmt * FEE
			const netFrom = fromAmt - feeAmt
			const toAmt = netFrom * rate
			log(`2. Собираю информацию: ${fmt(fromAmt)} ${from} → ${fmt(toAmt)} ${to}, курс ${fmt(rate, 6)}`, 'step')

			if ((wallet[from] || 0) < fromAmt) {
				log('Ошибка: недостаточно средств — обмен отменён', 'warn')
				return
			}

			// 3
			const token = buildToken(quantum, from, fromAmt, rate, to, toAmt)
			log(`3. Создаю токен (квант времени + сделка)`, 'step')

			// 4
			log('4. Открываю ордер', 'step')

			// 5
			wallet[from] = +(wallet[from] - fromAmt).toFixed(10)
			log(`5. Снимаю ${fmt(fromAmt)} ${from} с кошелька пользователя`, 'step')

			// 6
			wallet[to] = +((wallet[to] || 0) + toAmt).toFixed(10)
			log(`6. Произвожу обмен, пополняю баланс: +${fmt(toAmt)} ${to}`, 'step')

			// 7
			appWallet[from] = +((appWallet[from] || 0) + feeAmt).toFixed(10)
			log(`7. Комиссия 1%: +${fmt(feeAmt)} ${from} → кошелёк приложения`, 'step')

			// 8
			log('8. Закрываю ордер', 'step')

			// 9
			orders.unshift({ id: quantum, token, from, fromAmt, to, toAmt, rate, feeAmt })
			log('9. Отправляю копию токена в архив', 'step')
			log('Обмен завершён', 'ok')

			$('tokenCard').classList.add('show')
			$('tokenBody').innerHTML = `<span class="t">${token}</span>`

			$('ordersBlock').style.display = 'block'
			$('ordersList').innerHTML = orders.map(o =>
				`<li>${o.token}<br><span style="color:#8b8b9e">комиссия ${fmt(o.feeAmt)} ${o.from} → приложение</span></li>`
			).join('')

			renderBalances()
			renderAppWallet()

			reserve = null
			$('fromAmount').value = ''
			$('toAmount').value = ''
			updateReserve()
		}

		async function fetchRates() {
			try {
				const res = await fetch(
					`https://api.coingecko.com/api/v3/simple/price?ids=${Object.values(CG).join(',')}&vs_currencies=usd`
				)
				if (!res.ok) throw new Error('HTTP')
				const data = await res.json()
				prevUsd = { ...usd }
				for (const [sym, id] of Object.entries(CG)) {
					if (data[id]?.usd != null) usd[sym] = data[id].usd
				}
			} catch {
				prevUsd = { ...usd }
				for (const k of Object.keys(usd)) {
					if (k === 'USDT' || k === 'USDC') continue
					usd[k] = +(usd[k] * (1 + (Math.random() - 0.5) * 0.004)).toFixed(4)
				}
			}
			renderRates()
			recalc()
		}

		log('Nemo готов · лог действий для тестирования')
		renderBalances()
		renderRates()
		renderAppWallet()
		fetchRates()
		setInterval(fetchRates, 8000)
	</script>
</body>
</html>
