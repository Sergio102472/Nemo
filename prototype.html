<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Nemo — обмен</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: #0f0f1a;
			color: #e8e8e8;
			min-height: 100vh;
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding: 32px 16px;
		}
		.box {
			width: 100%;
			max-width: 420px;
			background: #1a1a2e;
			border: 1px solid #2a2a45;
			border-radius: 16px;
			padding: 24px 20px;
		}
		h1 {
			text-align: center;
			font-size: 1.5rem;
			margin-bottom: 20px;
			background: linear-gradient(90deg, #7c5cff, #00d4ff);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
		}
		.block {
			background: #12121f;
			border: 1px solid #2a2a45;
			border-radius: 14px;
			padding: 14px;
			margin-bottom: 12px;
		}
		.block-label {
			font-size: 0.7rem;
			color: #8b8b9e;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			margin-bottom: 10px;
		}
		.row {
			display: flex;
			gap: 10px;
			align-items: center;
			margin-bottom: 10px;
		}
		.row:last-child { margin-bottom: 0; }
		.wrap { position: relative; }
		button.currency {
			min-width: 100px;
			padding: 12px 14px;
			border-radius: 12px;
			border: 1px solid #3a3a5c;
			background: #252540;
			color: #fff;
			font-weight: 700;
			font-size: 0.95rem;
			cursor: pointer;
		}
		button.currency:hover { border-color: #7c5cff; }
		.balance {
			flex: 1;
			text-align: right;
			font-family: ui-monospace, monospace;
			font-size: 0.9rem;
			color: #9a9ab0;
		}
		.balance b { color: #e8e8e8; }
		input[type="number"] {
			flex: 1;
			padding: 12px 14px;
			border-radius: 12px;
			border: 1px solid #3a3a5c;
			background: #1a1a2e;
			color: #fff;
			font-size: 1.1rem;
			font-weight: 600;
			outline: none;
			min-width: 0;
		}
		input[type="number"]:focus { border-color: #7c5cff; }
		.rate {
			flex-shrink: 0;
			text-align: right;
			font-size: 0.8rem;
			color: #00d4ff;
			font-family: ui-monospace, monospace;
			line-height: 1.3;
			max-width: 140px;
		}
		.rate .tick { font-size: 0.75rem; }
		.rate .tick.up { color: #22c55e; }
		.rate .tick.down { color: #ef4444; }
		.rate .tick.flat { color: #8b8b9e; }
		.fee {
			text-align: center;
			margin: 12px 0;
			color: #a78bfa;
			font-size: 0.95rem;
		}
		button.swap {
			width: 100%;
			padding: 14px;
			border: none;
			border-radius: 14px;
			background: linear-gradient(90deg, #7c5cff, #5b8def);
			color: #fff;
			font-size: 1.1rem;
			font-weight: 700;
			cursor: pointer;
		}
		button.swap:disabled { opacity: 0.4; cursor: not-allowed; }
		button.swap:hover:not(:disabled) { opacity: 0.92; }
		.log {
			margin-top: 14px;
			font-size: 0.75rem;
			color: #8b8b9e;
			font-family: ui-monospace, monospace;
			min-height: 1.2em;
			text-align: center;
		}
		.menu {
			position: absolute;
			top: 100%;
			left: 0;
			margin-top: 4px;
			background: #252540;
			border: 1px solid #3a3a5c;
			border-radius: 12px;
			padding: 6px;
			z-index: 20;
			display: none;
			min-width: 120px;
			box-shadow: 0 8px 24px rgba(0,0,0,0.4);
		}
		.menu.open { display: block; }
		.menu button {
			display: block;
			width: 100%;
			text-align: left;
			background: transparent;
			border: none;
			color: #e8e8e8;
			padding: 10px 12px;
			border-radius: 8px;
			cursor: pointer;
			font-weight: 600;
		}
		.menu button:hover { background: rgba(124,92,255,0.25); }
	</style>
</head>
<body>
	<div class="box">
		<h1>Nemo</h1>

		<!-- ОТДАЁТЕ -->
		<div class="block">
			<div class="block-label">Отдаёте</div>
			<div class="row">
				<div class="wrap">
					<button type="button" class="currency" id="fromBtn">BTC</button>
					<div class="menu" id="fromMenu"></div>
				</div>
				<div class="balance" id="fromBal">Баланс: <b>0</b></div>
			</div>
			<div class="row">
				<input type="number" id="fromAmount" placeholder="0.0" min="0" step="any" />
				<div class="rate" id="fromRate">—</div>
			</div>
		</div>

		<!-- ПОЛУЧАЕТЕ -->
		<div class="block">
			<div class="block-label">Получаете</div>
			<div class="row">
				<div class="wrap">
					<button type="button" class="currency" id="toBtn">USDT</button>
					<div class="menu" id="toMenu"></div>
				</div>
				<div class="balance" id="toBal">Баланс: <b>0</b></div>
			</div>
			<div class="row">
				<input type="number" id="toAmount" placeholder="0.0" min="0" step="any" />
				<div class="rate" id="toRate">—</div>
			</div>
		</div>

		<div class="fee">Комиссия 2%</div>
		<button type="button" class="swap" id="swapBtn" disabled>Обменять</button>
		<div class="log" id="log"></div>
	</div>

	<script>
		const COINS = ['BTC', 'ETH', 'USDT', 'USDC', 'SOL', 'BNB']
		const CG = {
			BTC: 'bitcoin', ETH: 'ethereum', USDT: 'tether',
			USDC: 'usd-coin', SOL: 'solana', BNB: 'binancecoin',
		}
		const FEE = 0.02

		// Виртуальный баланс кошелька
		let wallet = { BTC: 0.5, ETH: 4.2, USDT: 2500, USDC: 1000, SOL: 35, BNB: 8 }
		let usd = { BTC: 95000, ETH: 3200, USDT: 1, USDC: 1, SOL: 180, BNB: 580 }
		let prevUsd = { ...usd }

		let fromCoin = 'BTC'
		let toCoin = 'USDT'
		let editSide = 'from'

		const $ = id => document.getElementById(id)

		function fmt(n, digits = 8) {
			if (n == null || !isFinite(n)) return '0'
			return (+Number(n).toFixed(digits)).toString()
		}

		function pairRate() {
			return (usd[fromCoin] || 1) / (usd[toCoin] || 1)
		}

		function tickClass(coin) {
			const a = usd[coin], b = prevUsd[coin]
			if (b == null) return 'flat'
			if (a > b) return 'up'
			if (a < b) return 'down'
			return 'flat'
		}

		function tickSymbol(c) {
			return c === 'up' ? '▲' : c === 'down' ? '▼' : '●'
		}

		function renderBalances() {
			$('fromBal').innerHTML = `Баланс: <b>${fmt(wallet[fromCoin] || 0)} ${fromCoin}</b>`
			$('toBal').innerHTML = `Баланс: <b>${fmt(wallet[toCoin] || 0)} ${toCoin}</b>`
		}

		function renderRates() {
			const tf = tickClass(fromCoin)
			const tt = tickClass(toCoin)
			$('fromRate').innerHTML =
				`$${fmt(usd[fromCoin], 2)}<br><span class="tick ${tf}">${tickSymbol(tf)}</span>`
			$('toRate').innerHTML =
				`$${fmt(usd[toCoin], 2)}<br><span class="tick ${tt}">${tickSymbol(tt)}</span>`
		}

		function recalc() {
			const r = pairRate()
			if (editSide === 'from') {
				const v = parseFloat($('fromAmount').value)
				if (!v || v <= 0) { $('toAmount').value = ''; updateSwap(); return }
				$('toAmount').value = fmt(v * r * (1 - FEE))
			} else {
				const v = parseFloat($('toAmount').value)
				if (!v || v <= 0) { $('fromAmount').value = ''; updateSwap(); return }
				$('fromAmount').value = fmt(v / (r * (1 - FEE)))
			}
			updateSwap()
		}

		function updateSwap() {
			const v = parseFloat($('fromAmount').value)
			const ok = v > 0 && fromCoin !== toCoin && v <= (wallet[fromCoin] || 0)
			$('swapBtn').disabled = !ok
		}

		function fillMenu(menu, current, onPick) {
			menu.innerHTML = COINS.map(c =>
				`<button type="button" data-c="${c}">${c}${c === current ? ' ✓' : ''}</button>`
			).join('')
			menu.querySelectorAll('button').forEach(b => {
				b.onclick = (e) => {
					e.stopPropagation()
					onPick(b.dataset.c)
					menu.classList.remove('open')
				}
			})
		}

		$('fromBtn').onclick = (e) => {
			e.stopPropagation()
			$('toMenu').classList.remove('open')
			fillMenu($('fromMenu'), fromCoin, (c) => {
				fromCoin = c
				$('fromBtn').textContent = c
				renderBalances()
				renderRates()
				recalc()
			})
			$('fromMenu').classList.toggle('open')
		}
		$('toBtn').onclick = (e) => {
			e.stopPropagation()
			$('fromMenu').classList.remove('open')
			fillMenu($('toMenu'), toCoin, (c) => {
				toCoin = c
				$('toBtn').textContent = c
				renderBalances()
				renderRates()
				recalc()
			})
			$('toMenu').classList.toggle('open')
		}
		document.addEventListener('click', () => {
			$('fromMenu').classList.remove('open')
			$('toMenu').classList.remove('open')
		})

		$('fromAmount').addEventListener('input', () => { editSide = 'from'; recalc() })
		$('toAmount').addEventListener('input', () => { editSide = 'to'; recalc() })

		$('swapBtn').onclick = () => {
			const fromAmt = parseFloat($('fromAmount').value)
			const toAmt = parseFloat($('toAmount').value)
			if (!fromAmt || fromAmt > (wallet[fromCoin] || 0)) return

			wallet[fromCoin] = +(wallet[fromCoin] - fromAmt).toFixed(10)
			wallet[toCoin] = +((wallet[toCoin] || 0) + toAmt).toFixed(10)

			$('log').textContent =
				`Обмен: −${fmt(fromAmt)} ${fromCoin} → +${fmt(toAmt)} ${toCoin} (комиссия 2%)`

			$('fromAmount').value = ''
			$('toAmount').value = ''
			renderBalances()
			updateSwap()
		}

		async function fetchRates() {
			try {
				const ids = Object.values(CG).join(',')
				const res = await fetch(
					`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`
				)
				if (!res.ok) throw new Error('HTTP ' + res.status)
				const data = await res.json()
				prevUsd = { ...usd }
				for (const [sym, id] of Object.entries(CG)) {
					if (data[id]?.usd != null) usd[sym] = data[id].usd
				}
			} catch {
				prevUsd = { ...usd }
				for (const k of Object.keys(usd)) {
					if (k === 'USDT' || k === 'USDC') continue
					usd[k] = +(usd[k] * (1 + (Math.random() - 0.5) * 0.003)).toFixed(4)
				}
			}
			renderRates()
			recalc()
		}

		renderBalances()
		renderRates()
		fetchRates()
		setInterval(fetchRates, 10000)
	</script>
</body>
</html>
