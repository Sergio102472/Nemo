<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Nemo — Модуль 1 (прототип)</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
			min-height: 100vh;
			color: #e8e8e8;
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding: 24px 16px;
		}
		.app { width: 100%; max-width: 420px; }
		h1 {
			text-align: center;
			font-size: 1.75rem;
			background: linear-gradient(90deg, #7c5cff, #00d4ff);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			margin-bottom: 4px;
		}
		.subtitle {
			text-align: center;
			color: #8b8b9e;
			font-size: 0.9rem;
			margin-bottom: 20px;
		}
		.log {
			background: #1a1a2e;
			border: 1px solid #3a3a5c;
			border-radius: 12px;
			padding: 10px 14px;
			max-height: 140px;
			overflow-y: auto;
			font-family: ui-monospace, monospace;
			font-size: 0.72rem;
			color: #9a9ab0;
			margin-bottom: 20px;
			line-height: 1.5;
		}
		.log div { margin-bottom: 2px; }
		.card {
			background: rgba(30, 30, 50, 0.9);
			border: 1px solid #2a2a45;
			border-radius: 20px;
			padding: 24px 20px;
		}
		.row {
			display: flex;
			gap: 14px;
			margin-bottom: 16px;
		}
		.field { flex: 1; display: flex; flex-direction: column; gap: 6px; }
		label {
			font-size: 0.75rem;
			color: #8b8b9e;
			text-transform: uppercase;
			letter-spacing: 0.04em;
		}
		select, input[type="number"] {
			background: #1a1a2e;
			border: 1px solid #3a3a5c;
			color: #e8e8e8;
			padding: 12px 14px;
			border-radius: 12px;
			font-size: 1rem;
			outline: none;
			width: 100%;
		}
		select { cursor: pointer; }
		select:focus, input:focus { border-color: #7c5cff; }
		input[type="number"] {
			font-size: 1.2rem;
			font-weight: 600;
		}
		input[type="number"]::placeholder {
			color: #5a5a70;
			font-weight: 400;
		}
		input[readonly] {
			opacity: 0.85;
			cursor: default;
		}
		.rate {
			text-align: center;
			padding: 14px 12px;
			background: rgba(124, 92, 255, 0.1);
			border-radius: 12px;
			margin-bottom: 20px;
			font-size: 0.95rem;
			color: #b0b0c8;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 6px;
		}
		.rate-main strong { color: #00d4ff; font-size: 1.05rem; }
		.rate-tick {
			font-size: 0.85rem;
			font-weight: 600;
			display: flex;
			align-items: center;
			gap: 4px;
		}
		.rate-tick.up { color: #22c55e; }
		.rate-tick.down { color: #ef4444; }
		.rate-tick.flat { color: #8b8b9e; }
		.rate-meta {
			font-size: 0.7rem;
			color: #6b6b80;
		}
		button {
			width: 100%;
			background: linear-gradient(90deg, #7c5cff, #5b8def);
			border: none;
			color: white;
			padding: 15px;
			border-radius: 14px;
			font-size: 1.1rem;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { opacity: 0.92; }
		button:disabled { opacity: 0.4; cursor: not-allowed; }
		.footer {
			margin-top: 18px;
			text-align: center;
			font-size: 0.75rem;
			color: #5a5a70;
		}
	</style>
</head>
<body>
	<div class="app">
		<h1>Nemo</h1>
		<p class="subtitle">Модуль 1 · живые курсы · тики ↑↓</p>

		<div class="log" id="log"></div>

		<div class="card">
			<div class="row">
				<div class="field">
					<label>Отдаёте</label>
					<select id="from"></select>
				</div>
				<div class="field">
					<label>Получаете</label>
					<select id="to"></select>
				</div>
			</div>

			<div class="row">
				<div class="field">
					<label>Сумма</label>
					<input type="number" id="fromAmount" placeholder="0.0" min="0" step="any" />
				</div>
				<div class="field">
					<label>Сумма</label>
					<input type="number" id="toAmount" placeholder="0.0" readonly />
				</div>
			</div>

			<div class="rate" id="rateBox">
				<div class="rate-main" id="rateMain">—</div>
				<div class="rate-tick flat" id="rateTick">—</div>
				<div class="rate-meta" id="rateMeta">загрузка курса...</div>
			</div>

			<button id="swap" disabled>Обменять</button>
		</div>

		<p class="footer">Курсы обновляются каждые 8 сек · стрелка = направление тика · сумма «получаете» пересчитывается автоматически</p>
	</div>

	<script>
		const COINS = ['BTC', 'ETH', 'USDT', 'USDC', 'SOL', 'BNB']
		// CoinGecko ids
		const CG_IDS = {
			BTC: 'bitcoin',
			ETH: 'ethereum',
			USDT: 'tether',
			USDC: 'usd-coin',
			SOL: 'solana',
			BNB: 'binancecoin',
		}

		// fallback если API недоступен
		let ratesUsd = { BTC: 95000, ETH: 3200, USDT: 1, USDC: 1, SOL: 180, BNB: 580 }
		let prevPairRate = null
		let lastUpdate = null
		let liveMode = false

		const logEl = document.getElementById('log')
		const fromEl = document.getElementById('from')
		const toEl = document.getElementById('to')
		const fromAmountEl = document.getElementById('fromAmount')
		const toAmountEl = document.getElementById('toAmount')
		const rateMain = document.getElementById('rateMain')
		const rateTick = document.getElementById('rateTick')
		const rateMeta = document.getElementById('rateMeta')
		const swapBtn = document.getElementById('swap')

		function log(msg) {
			const time = new Date().toLocaleTimeString('ru-RU')
			const line = document.createElement('div')
			line.textContent = `[${time}] ${msg}`
			logEl.prepend(line)
			while (logEl.children.length > 30) logEl.lastChild.remove()
		}

		function fillSelects() {
			COINS.forEach(c => {
				fromEl.add(new Option(c, c))
				toEl.add(new Option(c, c))
			})
			fromEl.value = 'ETH'
			toEl.value = 'USDT'
		}

		function getPairRate() {
			const from = ratesUsd[fromEl.value] || 1
			const to = ratesUsd[toEl.value] || 1
			return from / to
		}

		function calcToAmount() {
			const amount = parseFloat(fromAmountEl.value)
			if (!amount || isNaN(amount) || amount <= 0) {
				toAmountEl.value = ''
				return
			}
			const result = amount * getPairRate()
			toAmountEl.value = result.toFixed(8).replace(/\.?0+$/, '')
		}

		function updateButton() {
			const amount = parseFloat(fromAmountEl.value)
			const same = fromEl.value === toEl.value
			swapBtn.disabled = same || !amount || amount <= 0
		}

		function renderRate(tickDir) {
			const from = fromEl.value
			const to = toEl.value
			const r = getPairRate()
			rateMain.innerHTML = `1 ${from} ≈ <strong>${r.toFixed(6)}</strong> ${to}`

			rateTick.className = 'rate-tick ' + (tickDir || 'flat')
			if (tickDir === 'up') {
				rateTick.textContent = '▲ вверх'
			} else if (tickDir === 'down') {
				rateTick.textContent = '▼ вниз'
			} else {
				rateTick.textContent = '● без изменений'
			}

			const src = liveMode ? 'CoinGecko (live)' : 'демо-курсы'
			const t = lastUpdate
				? lastUpdate.toLocaleTimeString('ru-RU')
				: '—'
			rateMeta.textContent = `${src} · обновлено ${t}`

			calcToAmount()
			updateButton()
		}

		function applyRates(newRates, sourceLive) {
			const pairBefore = getPairRate()
			ratesUsd = { ...ratesUsd, ...newRates }
			const pairAfter = getPairRate()
			lastUpdate = new Date()
			liveMode = sourceLive

			let dir = 'flat'
			if (prevPairRate !== null) {
				const diff = pairAfter - prevPairRate
				if (diff > 1e-12) dir = 'up'
				else if (diff < -1e-12) dir = 'down'
			}
			prevPairRate = pairAfter

			renderRate(dir)

			if (dir === 'up') {
				log(`Тик ▲ курс вырос: 1 ${fromEl.value} = ${pairAfter.toFixed(6)} ${toEl.value}`)
			} else if (dir === 'down') {
				log(`Тик ▼ курс упал: 1 ${fromEl.value} = ${pairAfter.toFixed(6)} ${toEl.value}`)
			} else if (sourceLive) {
				log(`Курс обновлён (без изменения): 1 ${fromEl.value} = ${pairAfter.toFixed(6)} ${toEl.value}`)
			}
		}

		// Симуляция микродвижения (если live API не ответил)
		function simulateTick() {
			const keys = Object.keys(ratesUsd)
			const next = { ...ratesUsd }
			keys.forEach(k => {
				if (k === 'USDT' || k === 'USDC') return
				const jitter = 1 + (Math.random() - 0.5) * 0.004 // ±0.2%
				next[k] = +(ratesUsd[k] * jitter).toFixed(4)
			})
			applyRates(next, false)
		}

		async function fetchLiveRates() {
			try {
				const ids = Object.values(CG_IDS).join(',')
				const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`
				const res = await fetch(url)
				if (!res.ok) throw new Error('HTTP ' + res.status)
				const data = await res.json()
				const mapped = {}
				for (const [sym, id] of Object.entries(CG_IDS)) {
					if (data[id] && data[id].usd != null) mapped[sym] = data[id].usd
				}
				if (Object.keys(mapped).length) {
					applyRates(mapped, true)
					return true
				}
			} catch (e) {
				log(`API недоступен (${e.message}), режим симуляции тиков`)
			}
			return false
		}

		async function refreshRates() {
			const ok = await fetchLiveRates()
			if (!ok) simulateTick()
		}

		fromEl.addEventListener('change', () => {
			log(`Выбрана валюта «из»: ${fromEl.value}`)
			prevPairRate = null
			renderRate('flat')
		})
		toEl.addEventListener('change', () => {
			log(`Выбрана валюта «в»: ${toEl.value}`)
			prevPairRate = null
			renderRate('flat')
		})

		fromAmountEl.addEventListener('input', () => {
			calcToAmount()
			updateButton()
			const v = fromAmountEl.value
			if (v) log(`Введена сумма: ${v} ${fromEl.value}`)
		})

		swapBtn.addEventListener('click', () => {
			const quantum = Date.now()
			const fromAmt = fromAmountEl.value
			const toAmt = toAmountEl.value
			const r = getPairRate()
			log(`Нажата кнопка «Обменять»`)
			log(`Создан токен (квант времени): ${quantum}`)
			log(`Ордер: ${fromAmt} ${fromEl.value} → ${toAmt} ${toEl.value} (курс ${r.toFixed(6)})`)
			log(`Внутренний обмен выполнен (демо)`)
		})

		// init
		fillSelects()
		log('Модуль 1 загружен')
		log('Запрос курсов...')
		renderRate('flat')
		refreshRates()
		setInterval(refreshRates, 8000)
	</script>
</body>
</html>
