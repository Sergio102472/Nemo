<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Nemo — Модуль 1</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
			min-height: 100vh;
			color: #e8e8e8;
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding: 24px 16px;
		}
		.app { width: 100%; max-width: 440px; }
		h1 {
			text-align: center;
			font-size: 1.75rem;
			background: linear-gradient(90deg, #7c5cff, #00d4ff);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			margin-bottom: 4px;
		}
		.subtitle {
			text-align: center;
			color: #8b8b9e;
			font-size: 0.9rem;
			margin-bottom: 20px;
		}
		.log {
			background: #1a1a2e;
			border: 1px solid #3a3a5c;
			border-radius: 12px;
			padding: 10px 14px;
			max-height: 130px;
			overflow-y: auto;
			font-family: ui-monospace, monospace;
			font-size: 0.72rem;
			color: #9a9ab0;
			margin-bottom: 16px;
			line-height: 1.5;
		}
		.log div { margin-bottom: 2px; }
		.card {
			background: rgba(30, 30, 50, 0.9);
			border: 1px solid #2a2a45;
			border-radius: 20px;
			padding: 24px 20px;
		}
		.row {
			display: flex;
			gap: 14px;
			margin-bottom: 16px;
		}
		.field { flex: 1; display: flex; flex-direction: column; gap: 6px; }
		label {
			font-size: 0.75rem;
			color: #8b8b9e;
			text-transform: uppercase;
			letter-spacing: 0.04em;
		}
		select, input[type="number"] {
			background: #1a1a2e;
			border: 1px solid #3a3a5c;
			color: #e8e8e8;
			padding: 12px 14px;
			border-radius: 12px;
			font-size: 1rem;
			outline: none;
			width: 100%;
		}
		select { cursor: pointer; }
		select:focus, input:focus { border-color: #7c5cff; }
		input[type="number"] { font-size: 1.2rem; font-weight: 600; }
		input[type="number"]::placeholder { color: #5a5a70; font-weight: 400; }
		input[readonly] { opacity: 0.85; cursor: default; }
		.reserve {
			font-size: 0.75rem;
			color: #8b8b9e;
			text-align: center;
			margin-bottom: 12px;
			min-height: 1.2em;
		}
		.reserve.active { color: #fbbf24; }
		.rate {
			text-align: center;
			padding: 14px 12px;
			background: rgba(124, 92, 255, 0.1);
			border-radius: 12px;
			margin-bottom: 16px;
			font-size: 0.95rem;
			color: #b0b0c8;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 6px;
		}
		.rate-main strong { color: #00d4ff; font-size: 1.05rem; }
		.rate-tick { font-size: 0.85rem; font-weight: 600; }
		.rate-tick.up { color: #22c55e; }
		.rate-tick.down { color: #ef4444; }
		.rate-tick.flat { color: #8b8b9e; }
		.rate-meta { font-size: 0.7rem; color: #6b6b80; }
		button {
			width: 100%;
			background: linear-gradient(90deg, #7c5cff, #5b8def);
			border: none;
			color: white;
			padding: 15px;
			border-radius: 14px;
			font-size: 1.1rem;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { opacity: 0.92; }
		button:disabled { opacity: 0.4; cursor: not-allowed; }
		.token-card {
			margin-top: 20px;
			background: rgba(0, 212, 255, 0.08);
			border: 1px solid rgba(0, 212, 255, 0.3);
			border-radius: 16px;
			padding: 16px 18px;
		}
		.token-title {
			font-size: 0.75rem;
			color: #00d4ff;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			margin-bottom: 10px;
			text-align: center;
		}
		.token-body {
			font-family: ui-monospace, monospace;
			font-size: 0.9rem;
			line-height: 1.55;
			color: #e8e8e8;
			word-break: break-word;
		}
		.token-time { color: #fbbf24; }
		.orders {
			margin-top: 20px;
		}
		.orders h3 {
			font-size: 0.8rem;
			color: #8b8b9e;
			text-align: center;
			margin-bottom: 10px;
		}
		.orders ul { list-style: none; }
		.orders li {
			background: rgba(30, 30, 50, 0.7);
			border: 1px solid #2a2a45;
			border-radius: 12px;
			padding: 12px 14px;
			margin-bottom: 8px;
			font-family: ui-monospace, monospace;
			font-size: 0.78rem;
			line-height: 1.45;
			color: #c8c8d8;
		}
		.footer {
			margin-top: 18px;
			text-align: center;
			font-size: 0.72rem;
			color: #5a5a70;
			line-height: 1.4;
		}
	</style>
</head>
<body>
	<div class="app">
		<h1>Nemo</h1>
		<p class="subtitle">Резерв → кнопка = ордер · токен = время сделки</p>

		<div class="log" id="log"></div>

		<div class="card">
			<div class="row">
				<div class="field">
					<label>Отдаёте</label>
					<select id="from"></select>
				</div>
				<div class="field">
					<label>Получаете</label>
					<select id="to"></select>
				</div>
			</div>

			<div class="row">
				<div class="field">
					<label>Сумма</label>
					<input type="number" id="fromAmount" placeholder="0.0" min="0" step="any" />
				</div>
				<div class="field">
					<label>Сумма</label>
					<input type="number" id="toAmount" placeholder="0.0" readonly />
				</div>
			</div>

			<div class="reserve" id="reserve">Нет резерва — введите сумму</div>

			<div class="rate">
				<div class="rate-main" id="rateMain">—</div>
				<div class="rate-tick flat" id="rateTick">—</div>
				<div class="rate-meta" id="rateMeta">загрузка курса...</div>
			</div>

			<button id="swap" disabled>Обменять</button>
		</div>

		<div class="token-card" id="tokenCard" style="display:none">
			<div class="token-title">Токен ордера (открыт)</div>
			<div class="token-body" id="tokenBody"></div>
		</div>

		<div class="orders" id="ordersBlock" style="display:none">
			<h3>Архив ордеров</h3>
			<ul id="ordersList"></ul>
		</div>

		<p class="footer">
			До кнопки — только резерв (кошельки не трогаем).<br>
			Нажатие «Обменять» = мгновенный внутренний обмен + токен времени.
		</p>
	</div>

	<script>
		const COINS = ['BTC', 'ETH', 'USDT', 'USDC', 'SOL', 'BNB']
		const CG_IDS = {
			BTC: 'bitcoin', ETH: 'ethereum', USDT: 'tether',
			USDC: 'usd-coin', SOL: 'solana', BNB: 'binancecoin',
		}

		let ratesUsd = { BTC: 95000, ETH: 3200, USDT: 1, USDC: 1, SOL: 180, BNB: 580 }
		let prevPairRate = null
		let lastUpdate = null
		let liveMode = false
		let reserve = null  // { from, to, fromAmt, toAmt, rate } — ещё не ордер
		let orders = []

		const logEl = document.getElementById('log')
		const fromEl = document.getElementById('from')
		const toEl = document.getElementById('to')
		const fromAmountEl = document.getElementById('fromAmount')
		const toAmountEl = document.getElementById('toAmount')
		const rateMain = document.getElementById('rateMain')
		const rateTick = document.getElementById('rateTick')
		const rateMeta = document.getElementById('rateMeta')
		const swapBtn = document.getElementById('swap')
		const reserveEl = document.getElementById('reserve')
		const tokenCard = document.getElementById('tokenCard')
		const tokenBody = document.getElementById('tokenBody')
		const ordersBlock = document.getElementById('ordersBlock')
		const ordersList = document.getElementById('ordersList')

		function log(msg) {
			const time = new Date().toLocaleTimeString('ru-RU')
			const line = document.createElement('div')
			line.textContent = `[${time}] ${msg}`
			logEl.prepend(line)
			while (logEl.children.length > 30) logEl.lastChild.remove()
		}

		function fillSelects() {
			COINS.forEach(c => {
				fromEl.add(new Option(c, c))
				toEl.add(new Option(c, c))
			})
			fromEl.value = 'ETH'
			toEl.value = 'USDT'
		}

		function getPairRate() {
			return (ratesUsd[fromEl.value] || 1) / (ratesUsd[toEl.value] || 1)
		}

		function calcToAmount() {
			const amount = parseFloat(fromAmountEl.value)
			if (!amount || isNaN(amount) || amount <= 0) {
				toAmountEl.value = ''
				return 0
			}
			const result = amount * getPairRate()
			toAmountEl.value = result.toFixed(8).replace(/\.?0+$/, '')
			return result
		}

		/** Человекочитаемое время: доля сек · сек · мин · час · день · месяц · год */
		function formatHumanTime(ms) {
			const d = new Date(ms)
			const pad = (n, len = 2) => String(n).padStart(len, '0')
			const year = d.getFullYear()
			const month = pad(d.getMonth() + 1)
			const day = pad(d.getDate())
			const hour = pad(d.getHours())
			const min = pad(d.getMinutes())
			const sec = pad(d.getSeconds())
			const frac = pad(d.getMilliseconds(), 3) // доля секунды (мс)
			// формат: ГГГГ.ММ.ДД ЧЧ:ММ:СС.ммм
			return `${year}.${month}.${day} ${hour}:${min}:${sec}.${frac}`
		}

		/** Лаконичный токен ордера */
		function buildToken(ms, from, fromAmt, to, toAmt) {
			const t = formatHumanTime(ms)
			return `${t} | ${fromAmt} ${from} → ${toAmt} ${to}`
		}

		function updateReserve() {
			const fromAmt = parseFloat(fromAmountEl.value)
			const toAmt = calcToAmount()
			const same = fromEl.value === toEl.value
			const valid = fromAmt > 0 && !same

			if (!valid) {
				reserve = null
				reserveEl.textContent = 'Нет резерва — введите сумму'
				reserveEl.className = 'reserve'
				swapBtn.disabled = true
				return
			}

			const rate = getPairRate()
			const toStr = toAmountEl.value
			reserve = {
				from: fromEl.value,
				to: toEl.value,
				fromAmt: fromAmt,
				toAmt: toStr,
				rate: rate,
			}
			reserveEl.textContent = `Резерв: ${fromAmt} ${fromEl.value} → ${toStr} ${toEl.value} (кошельки не тронуты)`
			reserveEl.className = 'reserve active'
			swapBtn.disabled = false
		}

		function renderRate(tickDir) {
			const from = fromEl.value
			const to = toEl.value
			const r = getPairRate()
			rateMain.innerHTML = `1 ${from} ≈ <strong>${r.toFixed(6)}</strong> ${to}`
			rateTick.className = 'rate-tick ' + (tickDir || 'flat')
			rateTick.textContent = tickDir === 'up' ? '▲ вверх' : tickDir === 'down' ? '▼ вниз' : '● без изменений'
			const src = liveMode ? 'CoinGecko (live)' : 'демо'
			const t = lastUpdate ? lastUpdate.toLocaleTimeString('ru-RU') : '—'
			rateMeta.textContent = `${src} · обновлено ${t}`
			updateReserve() // курс изменился → резерв и «получаете» обновляются
		}

		function applyRates(newRates, sourceLive) {
			const pairBefore = getPairRate()
			ratesUsd = { ...ratesUsd, ...newRates }
			const pairAfter = getPairRate()
			lastUpdate = new Date()
			liveMode = sourceLive

			let dir = 'flat'
			if (prevPairRate !== null) {
				const diff = pairAfter - prevPairRate
				if (diff > 1e-12) dir = 'up'
				else if (diff < -1e-12) dir = 'down'
			}
			prevPairRate = pairAfter
			renderRate(dir)

			if (dir === 'up') log(`Тик ▲ 1 ${fromEl.value} = ${pairAfter.toFixed(6)} ${toEl.value}`)
			else if (dir === 'down') log(`Тик ▼ 1 ${fromEl.value} = ${pairAfter.toFixed(6)} ${toEl.value}`)
		}

		function simulateTick() {
			const next = { ...ratesUsd }
			Object.keys(next).forEach(k => {
				if (k === 'USDT' || k === 'USDC') return
				next[k] = +(ratesUsd[k] * (1 + (Math.random() - 0.5) * 0.004)).toFixed(4)
			})
			applyRates(next, false)
		}

		async function fetchLiveRates() {
			try {
				const ids = Object.values(CG_IDS).join(',')
				const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`)
				if (!res.ok) throw new Error('HTTP ' + res.status)
				const data = await res.json()
				const mapped = {}
				for (const [sym, id] of Object.entries(CG_IDS)) {
					if (data[id]?.usd != null) mapped[sym] = data[id].usd
				}
				if (Object.keys(mapped).length) {
					applyRates(mapped, true)
					return true
				}
			} catch (e) {
				log(`API: ${e.message} → симуляция тиков`)
			}
			return false
		}

		async function refreshRates() {
			const ok = await fetchLiveRates()
			if (!ok) simulateTick()
		}

		function renderOrders() {
			if (!orders.length) {
				ordersBlock.style.display = 'none'
				return
			}
			ordersBlock.style.display = 'block'
			ordersList.innerHTML = orders.map(o =>
				`<li><span class="token-time">${o.token}</span></li>`
			).join('')
		}

		// ——— События ———
		fromEl.addEventListener('change', () => {
			log(`Выбрана валюта «из»: ${fromEl.value}`)
			prevPairRate = null
			renderRate('flat')
			if (reserve) log(`Резерв обновлён (валюта)`)
		})
		toEl.addEventListener('change', () => {
			log(`Выбрана валюта «в»: ${toEl.value}`)
			prevPairRate = null
			renderRate('flat')
			if (reserve) log(`Резерв обновлён (валюта)`)
		})

		fromAmountEl.addEventListener('input', () => {
			updateReserve()
			if (reserve) {
				log(`Резерв: ${reserve.fromAmt} ${reserve.from} → ${reserve.toAmt} ${reserve.to}`)
			}
		})

		/** Ордер открывается ТОЛЬКО здесь — момент нажатия */
		swapBtn.addEventListener('click', () => {
			if (!reserve) return

			// 1. Фиксируем момент нажатия
			const quantum = Date.now()

			// 2. Берём актуальный курс и суммы на этот момент (резерв уже пересчитан тиками)
			const fromAmt = reserve.fromAmt
			const toAmtNum = parseFloat(toAmountEl.value) || (fromAmt * getPairRate())
			const toAmtStr = toAmountEl.value || toAmtNum.toFixed(8).replace(/\.?0+$/, '')
			const from = reserve.from
			const to = reserve.to

			// 3. Человекочитаемый токен
			const token = buildToken(quantum, from, fromAmt, to, toAmtStr)

			const order = {
				id: quantum,
				token,
				timeHuman: formatHumanTime(quantum),
				from, fromAmt, to, toAmt: toAmtStr,
				rate: getPairRate(),
			}

			// 4. Мгновенный внутренний обмен (демо) + архив
			orders.unshift(order)
			renderOrders()

			tokenCard.style.display = 'block'
			tokenBody.innerHTML =
				`<span class="token-time">${order.timeHuman}</span><br>` +
				`${fromAmt} ${from} → ${toAmtStr} ${to}`

			log(`Ордер открыт`)
			log(`Токен: ${token}`)
			log(`Внутренний обмен выполнен (кошельки обновлены в демо)`)

			// 5. Резерв сброшен — сделка уже не «в запасе»
			reserve = null
			fromAmountEl.value = ''
			toAmountEl.value = ''
			updateReserve()
		})

		// init
		fillSelects()
		log('Модуль 1 загружен')
		log('До кнопки «Обменять» — только резерв, ордер не создаётся')
		renderRate('flat')
		refreshRates()
		setInterval(refreshRates, 8000)
	</script>
</body>
</html>
