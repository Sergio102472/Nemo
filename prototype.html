<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Nemo — Модуль 1</title>
	<style>
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
			background: linear-gradient(160deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
			min-height: 100vh;
			color: #e8e8e8;
			display: flex;
			justify-content: center;
			align-items: flex-start;
			padding: 16px;
		}
		.app { width: 100%; max-width: 440px; }

		/* ——— Меню кошельков ——— */
		.wallets-bar {
			display: flex;
			justify-content: flex-end;
			align-items: center;
			margin-bottom: 12px;
			position: relative;
		}
		.wallet-menu-btn {
			background: transparent;
			border: 1px solid rgba(255,255,255,0.35);
			border-radius: 10px;
			width: 40px;
			height: 40px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 0;
		}
		.wallet-menu-btn:hover { border-color: #fff; background: rgba(255,255,255,0.06); }
		.wallet-menu-btn svg { width: 22px; height: 22px; fill: #fff; }
		.wallet-dropdown {
			display: none;
			position: absolute;
			top: 48px;
			right: 0;
			width: 280px;
			background: #1a1a2e;
			border: 1px solid #3a3a5c;
			border-radius: 14px;
			padding: 10px;
			z-index: 50;
			box-shadow: 0 12px 32px rgba(0,0,0,0.45);
		}
		.wallet-dropdown.open { display: block; }
		.wallet-item {
			padding: 12px;
			border-radius: 10px;
			margin-bottom: 6px;
			background: rgba(255,255,255,0.03);
			border: 1px solid transparent;
		}
		.wallet-item:last-child { margin-bottom: 0; }
		.wallet-item-name {
			font-weight: 600;
			font-size: 0.95rem;
			margin-bottom: 6px;
			color: #fff;
		}
		.wallet-item-bal {
			font-size: 0.75rem;
			color: #9a9ab0;
			font-family: ui-monospace, monospace;
			line-height: 1.4;
		}
		.wallet-dropdown-title {
			font-size: 0.7rem;
			color: #6b6b80;
			text-transform: uppercase;
			letter-spacing: 0.04em;
			margin-bottom: 8px;
			padding: 0 4px;
		}

		h1 {
			text-align: center;
			font-size: 1.75rem;
			background: linear-gradient(90deg, #7c5cff, #00d4ff);
			-webkit-background-clip: text;
			-webkit-text-fill-color: transparent;
			margin-bottom: 4px;
		}
		.subtitle {
			text-align: center;
			color: #8b8b9e;
			font-size: 0.9rem;
			margin-bottom: 16px;
		}
		.log {
			background: #1a1a2e;
			border: 1px solid #3a3a5c;
			border-radius: 12px;
			padding: 10px 14px;
			max-height: 120px;
			overflow-y: auto;
			font-family: ui-monospace, monospace;
			font-size: 0.7rem;
			color: #9a9ab0;
			margin-bottom: 14px;
			line-height: 1.5;
		}
		.log div { margin-bottom: 2px; }
		.card {
			background: rgba(30, 30, 50, 0.9);
			border: 1px solid #2a2a45;
			border-radius: 20px;
			padding: 22px 18px;
		}
		.row { display: flex; gap: 12px; margin-bottom: 14px; }
		.field { flex: 1; display: flex; flex-direction: column; gap: 6px; }
		label {
			font-size: 0.72rem;
			color: #8b8b9e;
			text-transform: uppercase;
			letter-spacing: 0.04em;
		}
		select, input[type="number"] {
			background: #1a1a2e;
			border: 1px solid #3a3a5c;
			color: #e8e8e8;
			padding: 11px 12px;
			border-radius: 12px;
			font-size: 1rem;
			outline: none;
			width: 100%;
		}
		select { cursor: pointer; }
		select:focus, input:focus { border-color: #7c5cff; }
		input[type="number"] { font-size: 1.15rem; font-weight: 600; }
		input[readonly] { opacity: 0.85; cursor: default; }
		.reserve {
			font-size: 0.72rem;
			color: #8b8b9e;
			text-align: center;
			margin-bottom: 10px;
			min-height: 1.2em;
		}
		.reserve.active { color: #fbbf24; }
		.rate {
			text-align: center;
			padding: 12px;
			background: rgba(124, 92, 255, 0.1);
			border-radius: 12px;
			margin-bottom: 14px;
			font-size: 0.92rem;
			color: #b0b0c8;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 4px;
		}
		.rate-main strong { color: #00d4ff; }
		.rate-tick { font-size: 0.82rem; font-weight: 600; }
		.rate-tick.up { color: #22c55e; }
		.rate-tick.down { color: #ef4444; }
		.rate-tick.flat { color: #8b8b9e; }
		.rate-meta { font-size: 0.68rem; color: #6b6b80; }
		button.swap {
			width: 100%;
			background: linear-gradient(90deg, #7c5cff, #5b8def);
			border: none;
			color: white;
			padding: 14px;
			border-radius: 14px;
			font-size: 1.05rem;
			font-weight: 600;
			cursor: pointer;
		}
		button.swap:hover { opacity: 0.92; }
		button.swap:disabled { opacity: 0.4; cursor: not-allowed; }

		.token-card {
			margin-top: 16px;
			background: rgba(0, 212, 255, 0.08);
			border: 1px solid rgba(0, 212, 255, 0.3);
			border-radius: 16px;
			padding: 14px 16px;
		}
		.token-title {
			font-size: 0.72rem;
			color: #00d4ff;
			text-transform: uppercase;
			letter-spacing: 0.05em;
			margin-bottom: 8px;
			text-align: center;
		}
		.token-body {
			font-family: ui-monospace, monospace;
			font-size: 0.85rem;
			line-height: 1.55;
			color: #e8e8e8;
		}
		.token-time { color: #fbbf24; }
		.transfer-info {
			margin-top: 10px;
			padding-top: 10px;
			border-top: 1px solid rgba(255,255,255,0.08);
			font-size: 0.8rem;
			color: #b0b0c8;
			line-height: 1.5;
		}
		.transfer-info .out { color: #ef4444; }
		.transfer-info .in { color: #22c55e; }

		.orders { margin-top: 16px; }
		.orders h3 {
			font-size: 0.78rem;
			color: #8b8b9e;
			text-align: center;
			margin-bottom: 8px;
		}
		.orders ul { list-style: none; }
		.orders li {
			background: rgba(30, 30, 50, 0.7);
			border: 1px solid #2a2a45;
			border-radius: 12px;
			padding: 10px 12px;
			margin-bottom: 6px;
			font-family: ui-monospace, monospace;
			font-size: 0.72rem;
			line-height: 1.45;
			color: #c8c8d8;
		}
		.footer {
			margin-top: 16px;
			text-align: center;
			font-size: 0.7rem;
			color: #5a5a70;
			line-height: 1.4;
		}
	</style>
</head>
<body>
	<div class="app">
		<!-- Белая иконка меню кошельков -->
		<div class="wallets-bar">
			<button type="button" class="wallet-menu-btn" id="walletMenuBtn" aria-label="Кошельки" title="Подключённые кошельки">
				<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
					<path d="M21 7H3a1 1 0 0 0-1 1v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a1 1 0 0 0-1-1zm-1 10H4V9h16v8zm1-12H3a1 1 0 0 0 0 2h18a1 1 0 0 0 0-2z"/>
					<circle cx="17" cy="13" r="1.5" fill="#fff"/>
				</svg>
			</button>
			<div class="wallet-dropdown" id="walletDropdown">
				<div class="wallet-dropdown-title">Подключённые кошельки</div>
				<div id="walletList"></div>
			</div>
		</div>

		<h1>Nemo</h1>
		<p class="subtitle">2 кошелька · резерв → ордер · токен времени</p>

		<div class="log" id="log"></div>

		<div class="card">
			<div class="row">
				<div class="field">
					<label>Отдаёте</label>
					<select id="from"></select>
				</div>
				<div class="field">
					<label>Получаете</label>
					<select id="to"></select>
				</div>
			</div>

			<div class="row">
				<div class="field">
					<label>Сумма</label>
					<input type="number" id="fromAmount" placeholder="0.0" min="0" step="any" />
				</div>
				<div class="field">
					<label>Сумма</label>
					<input type="number" id="toAmount" placeholder="0.0" readonly />
				</div>
			</div>

			<div class="reserve" id="reserve">Нет резерва — введите сумму</div>

			<div class="rate">
				<div class="rate-main" id="rateMain">—</div>
				<div class="rate-tick flat" id="rateTick">—</div>
				<div class="rate-meta" id="rateMeta">загрузка курса...</div>
			</div>

			<button type="button" class="swap" id="swap" disabled>Обменять</button>
		</div>

		<div class="token-card" id="tokenCard" style="display:none">
			<div class="token-title">Токен ордера (открыт)</div>
			<div class="token-body" id="tokenBody"></div>
			<div class="transfer-info" id="transferInfo"></div>
		</div>

		<div class="orders" id="ordersBlock" style="display:none">
			<h3>Архив ордеров</h3>
			<ul id="ordersList"></ul>
		</div>

		<p class="footer">
			Списание с одного кошелька → зачисление на другой.<br>
			До кнопки — только резерв. Ордер = момент нажатия.
		</p>
	</div>

	<script>
		const COINS = ['BTC', 'ETH', 'USDT', 'USDC', 'SOL', 'BNB']
		const CG_IDS = {
			BTC: 'bitcoin', ETH: 'ethereum', USDT: 'tether',
			USDC: 'usd-coin', SOL: 'solana', BNB: 'binancecoin',
		}

		// Два виртуальных кошелька
		let wallets = [
			{
				id: 'w1',
				name: 'Кошелёк Alpha',
				balances: { BTC: 0.15, ETH: 3.2, USDT: 500, SOL: 20 },
			},
			{
				id: 'w2',
				name: 'Кошелёк Beta',
				balances: { ETH: 1.0, USDC: 800, BNB: 5, USDT: 200 },
			},
		]

		let ratesUsd = { BTC: 95000, ETH: 3200, USDT: 1, USDC: 1, SOL: 180, BNB: 580 }
		let prevPairRate = null
		let lastUpdate = null
		let liveMode = false
		let reserve = null
		let orders = []

		const logEl = document.getElementById('log')
		const fromEl = document.getElementById('from')
		const toEl = document.getElementById('to')
		const fromAmountEl = document.getElementById('fromAmount')
		const toAmountEl = document.getElementById('toAmount')
		const rateMain = document.getElementById('rateMain')
		const rateTick = document.getElementById('rateTick')
		const rateMeta = document.getElementById('rateMeta')
		const swapBtn = document.getElementById('swap')
		const reserveEl = document.getElementById('reserve')
		const tokenCard = document.getElementById('tokenCard')
		const tokenBody = document.getElementById('tokenBody')
		const transferInfo = document.getElementById('transferInfo')
		const ordersBlock = document.getElementById('ordersBlock')
		const ordersList = document.getElementById('ordersList')
		const walletMenuBtn = document.getElementById('walletMenuBtn')
		const walletDropdown = document.getElementById('walletDropdown')
		const walletList = document.getElementById('walletList')

		function log(msg) {
			const time = new Date().toLocaleTimeString('ru-RU')
			const line = document.createElement('div')
			line.textContent = `[${time}] ${msg}`
			logEl.prepend(line)
			while (logEl.children.length > 35) logEl.lastChild.remove()
		}

		function fmtBal(n) {
			const x = Number(n)
			if (!x) return '0'
			return x.toFixed(6).replace(/\.?0+$/, '')
		}

		function renderWalletList() {
			walletList.innerHTML = wallets.map(w => {
				const lines = Object.entries(w.balances)
					.filter(([, v]) => v > 0)
					.map(([c, v]) => `${c}: ${fmtBal(v)}`)
					.join(' · ') || 'пусто'
				return `<div class="wallet-item">
					<div class="wallet-item-name">${w.name}</div>
					<div class="wallet-item-bal">${lines}</div>
				</div>`
			}).join('')
		}

		function totalBalance(coin) {
			return wallets.reduce((s, w) => s + (w.balances[coin] || 0), 0)
		}

		/** Кошелёк-источник: тот, где есть from-валюта */
		function pickSourceWallet(coin, amount) {
			return wallets.find(w => (w.balances[coin] || 0) >= amount)
				|| wallets.find(w => (w.balances[coin] || 0) > 0)
				|| wallets[0]
		}

		/** Кошелёк-получатель: другой */
		function pickDestWallet(sourceId) {
			return wallets.find(w => w.id !== sourceId) || wallets[1] || wallets[0]
		}

		function fillSelects() {
			COINS.forEach(c => {
				fromEl.add(new Option(c, c))
				toEl.add(new Option(c, c))
			})
			fromEl.value = 'ETH'
			toEl.value = 'USDT'
		}

		function getPairRate() {
			return (ratesUsd[fromEl.value] || 1) / (ratesUsd[toEl.value] || 1)
		}

		function calcToAmount() {
			const amount = parseFloat(fromAmountEl.value)
			if (!amount || isNaN(amount) || amount <= 0) {
				toAmountEl.value = ''
				return 0
			}
			const result = amount * getPairRate()
			toAmountEl.value = result.toFixed(8).replace(/\.?0+$/, '')
			return result
		}

		function formatHumanTime(ms) {
			const d = new Date(ms)
			const pad = (n, len = 2) => String(n).padStart(len, '0')
			return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`
		}

		function buildToken(ms, from, fromAmt, to, toAmt) {
			return `${formatHumanTime(ms)} | ${fromAmt} ${from} → ${toAmt} ${to}`
		}

		function updateReserve() {
			const fromAmt = parseFloat(fromAmountEl.value)
			calcToAmount()
			const same = fromEl.value === toEl.value
			const valid = fromAmt > 0 && !same
			const available = totalBalance(fromEl.value)

			if (!valid) {
				reserve = null
				reserveEl.textContent = 'Нет резерва — введите сумму'
				reserveEl.className = 'reserve'
				swapBtn.disabled = true
				return
			}

			if (fromAmt > available) {
				reserve = null
				reserveEl.textContent = `Недостаточно ${fromEl.value}: доступно ${fmtBal(available)}`
				reserveEl.className = 'reserve'
				swapBtn.disabled = true
				return
			}

			const toStr = toAmountEl.value
			const src = pickSourceWallet(fromEl.value, fromAmt)
			const dst = pickDestWallet(src.id)
			reserve = {
				from: fromEl.value,
				to: toEl.value,
				fromAmt,
				toAmt: toStr,
				rate: getPairRate(),
				sourceId: src.id,
				destId: dst.id,
				sourceName: src.name,
				destName: dst.name,
			}
			reserveEl.textContent = `Резерв: ${fromAmt} ${fromEl.value} с «${src.name}» → ${toStr} ${toEl.value} на «${dst.name}»`
			reserveEl.className = 'reserve active'
			swapBtn.disabled = false
		}

		function renderRate(tickDir) {
			const r = getPairRate()
			rateMain.innerHTML = `1 ${fromEl.value} ≈ <strong>${r.toFixed(6)}</strong> ${toEl.value}`
			rateTick.className = 'rate-tick ' + (tickDir || 'flat')
			rateTick.textContent = tickDir === 'up' ? '▲ вверх' : tickDir === 'down' ? '▼ вниз' : '● без изменений'
			rateMeta.textContent = `${liveMode ? 'CoinGecko' : 'демо'} · ${lastUpdate ? lastUpdate.toLocaleTimeString('ru-RU') : '—'}`
			updateReserve()
		}

		function applyRates(newRates, sourceLive) {
			const before = getPairRate()
			ratesUsd = { ...ratesUsd, ...newRates }
			const after = getPairRate()
			lastUpdate = new Date()
			liveMode = sourceLive
			let dir = 'flat'
			if (prevPairRate !== null) {
				if (after > prevPairRate + 1e-12) dir = 'up'
				else if (after < prevPairRate - 1e-12) dir = 'down'
			}
			prevPairRate = after
			renderRate(dir)
			if (dir === 'up') log(`Тик ▲ 1 ${fromEl.value} = ${after.toFixed(6)} ${toEl.value}`)
			else if (dir === 'down') log(`Тик ▼ 1 ${fromEl.value} = ${after.toFixed(6)} ${toEl.value}`)
		}

		function simulateTick() {
			const next = { ...ratesUsd }
			Object.keys(next).forEach(k => {
				if (k === 'USDT' || k === 'USDC') return
				next[k] = +(ratesUsd[k] * (1 + (Math.random() - 0.5) * 0.004)).toFixed(4)
			})
			applyRates(next, false)
		}

		async function fetchLiveRates() {
			try {
				const ids = Object.values(CG_IDS).join(',')
				const res = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd`)
				if (!res.ok) throw new Error('HTTP ' + res.status)
				const data = await res.json()
				const mapped = {}
				for (const [sym, id] of Object.entries(CG_IDS)) {
					if (data[id]?.usd != null) mapped[sym] = data[id].usd
				}
				if (Object.keys(mapped).length) {
					applyRates(mapped, true)
					return true
				}
			} catch (e) {
				log(`API: ${e.message} → симуляция`)
			}
			return false
		}

		async function refreshRates() {
			if (!(await fetchLiveRates())) simulateTick()
		}

		function renderOrders() {
			if (!orders.length) { ordersBlock.style.display = 'none'; return }
			ordersBlock.style.display = 'block'
			ordersList.innerHTML = orders.map(o =>
				`<li>${o.token}<br><span style="color:#8b8b9e">− ${o.fromAmt} ${o.from} ← ${o.sourceName} · + ${o.toAmt} ${o.to} → ${o.destName}</span></li>`
			).join('')
		}

		// Меню кошельков
		walletMenuBtn.addEventListener('click', (e) => {
			e.stopPropagation()
			renderWalletList()
			walletDropdown.classList.toggle('open')
		})
		document.addEventListener('click', () => walletDropdown.classList.remove('open'))
		walletDropdown.addEventListener('click', e => e.stopPropagation())

		fromEl.addEventListener('change', () => {
			log(`Валюта «из»: ${fromEl.value}`)
			prevPairRate = null
			renderRate('flat')
		})
		toEl.addEventListener('change', () => {
			log(`Валюта «в»: ${toEl.value}`)
			prevPairRate = null
			renderRate('flat')
		})
		fromAmountEl.addEventListener('input', () => {
			updateReserve()
			if (reserve) log(`Резерв: ${reserve.fromAmt} ${reserve.from} (${reserve.sourceName}) → ${reserve.toAmt} ${reserve.to} (${reserve.destName})`)
		})

		swapBtn.addEventListener('click', () => {
			if (!reserve) return

			const quantum = Date.now()
			const fromAmt = reserve.fromAmt
			const toAmtStr = toAmountEl.value || String(+(fromAmt * getPairRate()).toFixed(8))
			const toAmtNum = parseFloat(toAmtStr)
			const from = reserve.from
			const to = reserve.to

			const src = wallets.find(w => w.id === reserve.sourceId)
			const dst = wallets.find(w => w.id === reserve.destId)
			if (!src || !dst) return

			// Проверка баланса на момент нажатия
			if ((src.balances[from] || 0) < fromAmt) {
				log(`Ошибка: на «${src.name}» недостаточно ${from}`)
				updateReserve()
				return
			}

			// Списание с исходного кошелька
			src.balances[from] = +((src.balances[from] || 0) - fromAmt).toFixed(8)
			// Зачисление на другой кошелёк
			dst.balances[to] = +((dst.balances[to] || 0) + toAmtNum).toFixed(8)

			const token = buildToken(quantum, from, fromAmt, to, toAmtStr)
			const order = {
				id: quantum,
				token,
				timeHuman: formatHumanTime(quantum),
				from, fromAmt, to, toAmt: toAmtStr,
				sourceName: src.name,
				destName: dst.name,
			}
			orders.unshift(order)
			renderOrders()
			renderWalletList()

			tokenCard.style.display = 'block'
			tokenBody.innerHTML =
				`<span class="token-time">${order.timeHuman}</span><br>${fromAmt} ${from} → ${toAmtStr} ${to}`
			transferInfo.innerHTML =
				`<span class="out">− ${fromAmt} ${from}</span> списано с «${src.name}»<br>` +
				`<span class="in">+ ${toAmtStr} ${to}</span> зачислено на «${dst.name}»`

			log(`Ордер открыт: ${token}`)
			log(`Списано ${fromAmt} ${from} с «${src.name}»`)
			log(`Зачислено ${toAmtStr} ${to} на «${dst.name}»`)

			reserve = null
			fromAmountEl.value = ''
			toAmountEl.value = ''
			updateReserve()
		})

		fillSelects()
		renderWalletList()
		log('Модуль 1: 2 виртуальных кошелька подключены')
		log('Alpha и Beta — смотри иконку кошелька справа вверху')
		renderRate('flat')
		refreshRates()
		setInterval(refreshRates, 8000)
	</script>
